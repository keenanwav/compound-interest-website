<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compound Interest - Premium Extensions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
            background: var(--color-background-primary);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 2.5rem;
            font-weight: 500;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        h1 {
            font-size: 2rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--color-text-primary);
        }
        
        .tagline {
            font-size: 1rem;
            color: var(--color-text-secondary);
            margin-bottom: 3rem;
            line-height: 1.6;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .btn {
            padding: 1rem 2rem;
            font-size: 1rem;
            font-weight: 500;
            border: none;
            border-radius: var(--border-radius-lg, 12px);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-family: inherit;
        }
        
        .btn-premium {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-premium:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        
        .btn-ads {
            background: var(--color-background-secondary);
            color: var(--color-text-primary);
            border: 2px solid var(--color-border-secondary);
        }
        
        .btn-ads:hover {
            border-color: var(--color-border-primary);
            background: var(--color-background-tertiary);
        }
        
        .btn-ads small {
            display: block;
            font-size: 0.75rem;
            color: var(--color-text-secondary);
            font-weight: 400;
            margin-top: 0.25rem;
        }
        
        .footer {
            font-size: 0.875rem;
            color: var(--color-text-tertiary);
            margin-top: 2rem;
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }
            
            .logo {
                font-size: 2rem;
            }
            
            .btn {
                padding: 0.875rem 1.5rem;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚡</div>
        <h1>Compound Interest</h1>
        <p class="tagline">Unlock premium features for your browser extensions. Choose your path.</p>
        
        <div class="button-group">
            <button class="btn btn-premium" onclick="handlePremium()">
                Get Premium
            </button>
            
            <button class="btn btn-ads" onclick="handleAds()">
                Watch ads to unlock premium
                <small>Free • Takes 5-10 minutes</small>
            </button>
        </div>
        
        <div class="footer">
            <p>Secure • No sign-up required • 30-day access</p>
        </div>
    </div>
    
    <script>
        function handlePremium() {
            // Redirect to payment page (you'll set this up later)
            window.location.href = '/premium';
            console.log('Redirecting to premium payment page...');
        }
        
        function handleAds() {
            // Redirect to ads page (you'll set this up later)
            window.location.href = '/watch-ads';
            console.log('Redirecting to ad watching page...');
        }
    </script>
</body>
</html>
